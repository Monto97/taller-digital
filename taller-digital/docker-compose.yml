# MySQL para desarrollo local.
# La primera vez que arranca crea la base taller_digital a partir de database/schema.sql.
# Para volver a un schema limpio: docker compose down -v && docker compose up -d
services:
  mysql:
    image: mysql:8.0
    container_name: taller-digital-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: taller123
      TZ: UTC
    ports:
      - "3307:3306"
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ptaller123"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql_data:
